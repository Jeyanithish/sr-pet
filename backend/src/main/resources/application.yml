server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: sr-pet-world-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sr_pet_world}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-32-byte-minimum-secret-key-2026}
    issuer: ${JWT_ISSUER:sr-pet-world}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    auth-per-min: ${RATE_LIMIT_AUTH_PER_MIN:10}
    payment-per-min: ${RATE_LIMIT_PAYMENT_PER_MIN:20}
    general-per-min: ${RATE_LIMIT_GENERAL_PER_MIN:100}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-south-1}
  storage:
    local-upload-dir: ${LOCAL_UPLOAD_DIR:uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
